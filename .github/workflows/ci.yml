name: Companion AI OS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: System Doctor, Frontend & Leak Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Secret & User-Data Leak Gate
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, sys
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_files = {".env", "secrets.env", "MEMORY.md", "IDENTITY.md"}
          bad_files = [
              f for f in tracked
              if f in forbidden_files or f.startswith(("data/", "companion-data/", ".companion_backups/")) or f.endswith((".db", ".sqlite", ".exe"))
          ]
          if bad_files:
              print(f"FAIL: Tracked user-data or secret files detected: {bad_files}")
              sys.exit(1)
          secret_re = re.compile(
              r"(?:"
              r"-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----"
              r"|sk-ant-[A-Za-z0-9_-]{20,}"
              r"|sk-(?:proj-|live-)[A-Za-z0-9_-]{20,}"
              r"|AIza[0-9A-Za-z_-]{32,}"
              r"|ghp_[A-Za-z0-9]{30,}"
              r"|github_pat_[A-Za-z0-9_]{30,}"
              r"|glpat-[A-Za-z0-9_-]{20,}"
              r"|xox[baprs]-[A-Za-z0-9-]{20,}"
              r")"
          )
          leaks = []
          for rel in tracked:
              if rel.startswith(("tests/", "frontend/tests/")):
                  continue
              try:
                  txt = open(rel, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              if secret_re.search(txt):
                  leaks.append(rel)
          if leaks:
              print(f"FAIL: Potential credential pattern detected in: {leaks}")
              sys.exit(1)
          print(f"Leak gate passed across {len(tracked)} tracked files.")
          PY

      - name: Run 7-Stage System Doctor & Python Unit Tests
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}/companion-ci-data
        run: python harness.py --doctor

      - name: Run Frontend Typecheck, Interactive Vitest Suite & Static Bundle Sync Gate
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code ../surfaces/static
