name: Companion AI OS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: System Doctor, Frontend & Leak Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Secret & User-Data Leak Gate
        run: |
          python - <<'PY'
          import re, subprocess, sys
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_files = {".env", "secrets.env", "MEMORY.md", "IDENTITY.md"}
          bad_files = [
              f for f in tracked
              if f in forbidden_files or f.startswith(("data/", "companion-data/", ".companion_backups/")) or f.endswith((".db", ".sqlite", ".exe"))
          ]
          if bad_files:
              print(f"FAIL: Tracked user-data or secret files detected: {bad_files}")
              sys.exit(1)
          secret_re = re.compile(r"(?:-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----|sk-ant-api03-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,})")
          leaks = []
          for rel in tracked:
              if rel.startswith("tests/"):
                  continue
              try:
                  txt = open(rel, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              if secret_re.search(txt):
                  leaks.append(rel)
          if leaks:
              print(f"FAIL: Potential credential pattern detected in: {leaks}")
              sys.exit(1)
          print(f"Leak gate passed across {len(tracked)} tracked files.")
          PY

      - name: Run 7-Stage System Doctor & Python Unit Tests
        env:
          COMPANION_DATA_DIR: /tmp/companion-ci-data
        run: python harness.py --doctor

      - name: Run Frontend Typecheck, Interactive Vitest Suite & Static Bundle Sync
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
